<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>問問小仙</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="紫微小仙" />
<meta name="theme-color" content="#0f1115" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --gold: #c9a24b;
    --text: #e8e6e1;
    --muted: #8f93a0;
  }
  * { box-sizing: border-box; }
  .hidden { display: none; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    /* iPhone 的圓角螢幕＋Home Indicator 會吃掉畫面四周。左右兩側的圓角是螢幕
       物理曲面造成的，safe-area-inset-left/right 在直向模式下其實是 0（那兩個
       inset 只反映瀏海／Home Indicator，不反映圓角本身），所以左右要靠加大基礎
       padding 來避開，不能只靠 env()；上下則兩者並用，取較大值。 */
    padding: max(12px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(12px, calc(env(safe-area-inset-bottom) + 6px)) max(18px, env(safe-area-inset-left));
    gap: 10px;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  header a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  header a:hover { color: var(--gold); }
  header h1 {
    font-size: 1rem;
    color: var(--gold);
    margin: 0;
  }
  header .who {
    font-size: 0.8rem;
    color: var(--muted);
    margin-left: auto;
  }

  /* 目前這一輪問題，固定在上方，不隨 AI 回答捲動 */
  #question-card {
    flex: 0 0 auto;
    background: rgba(91, 155, 213, 0.1);
    border: 1px solid #5b9bd5;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.82rem;
    line-height: 1.4;
    white-space: pre-wrap;
  }

  #output-area {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    max-width: 480px;
    padding: 16px;
  }
  .empty-state p {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 14px;
  }
  .example-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .example-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .example-chip:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .msg {
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.92rem;
    line-height: 1.7;
  }
  .msg.assistant {
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .msg.error {
    background: rgba(224, 112, 112, 0.12);
    border: 1px solid #e07070;
    color: #e07070;
  }
  .msg.loading {
    color: var(--muted);
    font-size: 0.85rem;
    margin: auto;
  }

  .msg.assistant h3, .msg.assistant h4 {
    color: var(--gold);
    margin: 14px 0 6px;
    font-size: 1rem;
  }
  .msg.assistant h3:first-child, .msg.assistant h4:first-child { margin-top: 0; }
  .msg.assistant p { margin: 8px 0; }
  .msg.assistant strong { color: var(--gold); }
  .msg.assistant hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .msg.assistant table {
    border-collapse: collapse;
    width: 100%;
    margin: 8px 0;
    font-size: 0.85rem;
  }
  .msg.assistant th, .msg.assistant td {
    border: 1px solid var(--border);
    padding: 5px 8px;
    text-align: left;
  }
  .msg.assistant th { color: var(--gold); }
  .msg.assistant ul { margin: 8px 0; padding-left: 20px; }

  #input-area {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 90%;
    max-width: 90%;
    margin: 0 auto;
    /* 再往下移動自身高度的一半，不影響版面排列（不擠壓 output-area）。 */
    transform: translateY(50%);
  }
  #question-input {
    flex: 1;
    min-width: 0;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 0.92rem;
    font-family: inherit;
    height: 46px;
    line-height: 1.2;
  }
  #send-btn {
    flex: 0 0 auto;
    background: var(--panel);
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0 20px;
    height: 46px;
  }
  #send-btn:hover { background: rgba(201, 162, 75, 0.12); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .copy-full-btn {
    display: block;
    margin: 14px auto 4px;
    background: var(--panel);
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .copy-full-btn:hover { background: rgba(201, 162, 75, 0.12); }
  .copy-full-btn.copied { border-color: #70ad47; color: #70ad47; }
</style>
</head>
<body>
  <header>
    <a href="index.html">← 返回命盤</a>
    <h1>✨ 問問小仙</h1>
    <span class="who" id="who-label"></span>
  </header>

  <div id="question-card" class="hidden">
    <span id="question-card-text"></span>
  </div>

  <div id="output-area"></div>

  <div id="input-area">
    <textarea id="question-input" placeholder="輸入問題，例如：幫我論命"></textarea>
    <button type="button" id="send-btn">送出</button>
  </div>

<script>
  const API_BASE = 'https://ziwei-api-henna.vercel.app';
  const STORAGE_KEY = 'ziweiSavedUsers';
  const EXAMPLE_QUESTIONS = [
    '幫我論命',
    '看看我今年的工作運',
    '我的財運如何',
    '我適合什麼樣的伴侶',
    '我的健康需要注意什麼',
    '這十年整體運勢如何',
  ];

  const questionCard = document.getElementById('question-card');
  const questionCardText = document.getElementById('question-card-text');
  const outputArea = document.getElementById('output-area');
  const questionInput = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');
  const whoLabel = document.getElementById('who-label');

  function loadSavedUsers() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (err) {
      return [];
    }
  }

  function buildChartInput(birthInfo) {
    const input = {
      dateType: birthInfo.dateType,
      date: `${birthInfo.year}-${birthInfo.month}-${birthInfo.day}`,
      isLeapMonth: !!birthInfo.isLeapMonth,
      gender: birthInfo.gender,
      birthTime: `${String(birthInfo.birthHour).padStart(2, '0')}:${String(birthInfo.birthMinute).padStart(2, '0')}`,
    };
    const loc = birthInfo.location;
    if (loc && loc.latitude !== undefined && loc.longitude !== undefined && loc.timezoneId) {
      input.location = { latitude: loc.latitude, longitude: loc.longitude, timezoneId: loc.timezoneId };
    }
    return input;
  }

  function showFatalError(message) {
    outputArea.innerHTML = `
      <div class="empty-state">
        <p>${escapeHtml(message)}</p>
        <a class="example-chip" href="index.html">回到命盤頁面</a>
      </div>
    `;
    questionInput.disabled = true;
    sendBtn.disabled = true;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 把系統 prompt 會產生的輕量 markdown（###/####標題、**粗體**、---分隔線、
  // | table |、- 條列）轉成簡單的 HTML，不引入外部 markdown 套件。
  function renderAssistantMarkdown(text) {
    const escaped = escapeHtml(text);
    const lines = escaped.split('\n');
    const htmlParts = [];
    let i = 0;
    let inList = false;

    function closeList() {
      if (inList) { htmlParts.push('</ul>'); inList = false; }
    }

    function inline(s) {
      return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    while (i < lines.length) {
      const line = lines[i];

      if (/^#{3,4}\s+/.test(line)) {
        closeList();
        htmlParts.push(`<h3>${inline(line.replace(/^#{3,4}\s+/, ''))}</h3>`);
        i++;
        continue;
      }
      if (/^-{3,}$/.test(line.trim())) {
        closeList();
        htmlParts.push('<hr>');
        i++;
        continue;
      }
      if (/^\|.*\|$/.test(line.trim())) {
        closeList();
        const tableLines = [];
        while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) {
          tableLines.push(lines[i].trim());
          i++;
        }
        const rows = tableLines
          .filter((l) => !/^\|[\s-:|]+\|$/.test(l)) // drop the |---|---| separator row
          .map((l) => l.slice(1, -1).split('|').map((c) => c.trim()));
        if (rows.length) {
          const [headerRow, ...bodyRows] = rows;
          htmlParts.push('<table><thead><tr>' +
            headerRow.map((c) => `<th>${inline(c)}</th>`).join('') +
            '</tr></thead><tbody>' +
            bodyRows.map((r) => '<tr>' + r.map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
            '</tbody></table>');
        }
        continue;
      }
      if (/^[-*]\s+/.test(line)) {
        if (!inList) { htmlParts.push('<ul>'); inList = true; }
        htmlParts.push(`<li>${inline(line.replace(/^[-*]\s+/, ''))}</li>`);
        i++;
        continue;
      }
      closeList();
      if (line.trim() === '') { i++; continue; }
      htmlParts.push(`<p>${inline(line)}</p>`);
      i++;
    }
    closeList();
    return htmlParts.join('\n');
  }

  function showQuestionCard(text) {
    questionCardText.textContent = text;
    questionCard.classList.remove('hidden');
  }

  function showLoading() {
    outputArea.innerHTML = '<div class="msg loading">解盤中...</div>';
  }

  async function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }

  function showAssistantMessage(text) {
    outputArea.innerHTML = `
      <div class="msg assistant">${renderAssistantMarkdown(text)}</div>
      <button type="button" class="copy-full-btn" id="copy-full-btn">📋 複製全文</button>
    `;
    outputArea.scrollTop = 0;

    const copyBtn = document.getElementById('copy-full-btn');
    copyBtn.addEventListener('click', async () => {
      try {
        await copyTextToClipboard(text);
        copyBtn.textContent = '已複製 ✓';
        copyBtn.classList.add('copied');
      } catch (err) {
        copyBtn.textContent = '複製失敗';
      }
      setTimeout(() => {
        copyBtn.textContent = '📋 複製全文';
        copyBtn.classList.remove('copied');
      }, 1500);
    });
  }

  function showErrorMessage(text) {
    outputArea.innerHTML = `<div class="msg error">${escapeHtml(text)}</div>`;
  }

  function showEmptyState() {
    questionCard.classList.add('hidden');
    outputArea.innerHTML = `
      <div class="empty-state">
        <p>想問什麼都可以，或直接點下面的範例開始：</p>
        <div class="example-chips">
          ${EXAMPLE_QUESTIONS.map((q) => `<button type="button" class="example-chip" data-q="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join('')}
        </div>
      </div>
    `;
    outputArea.querySelectorAll('.example-chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        questionInput.value = btn.dataset.q;
        send();
      });
    });
  }

  let chartInput = null;
  let history = [];

  // debug 模式：?debug=1，不呼叫真的 API，固定回覆同一段文字，方便測 UI／不燒 API 額度。
  const isDebugMode = new URLSearchParams(location.search).get('debug') === '1';
  const DEBUG_ANSWER = [
    '### 說到底，你是什麼樣的人',
    '',
    '這是 **debug 模式** 的固定回覆，不管你問什麼，都會看到這一段文字——用來測試畫面排版、markdown 渲染跟複製功能，不會真的呼叫 API、不會消耗 OpenAI 額度。',
    '',
    '---',
    '',
    '### 這段文字包含的排版元素',
    '',
    '- 標題（###）',
    '- **粗體**',
    '- 分隔線（---）',
    '- 條列項目',
    '- 底下這張表格',
    '',
    '| 面向 | 評價 | 一句結論 |',
    '| --- | --- | --- |',
    '| 心態與心情 | ★★★★☆ | debug 用固定資料 |',
    '| 工作運 | ★★★☆☆ | debug 用固定資料 |',
    '| 財運 | ★★★★☆ | debug 用固定資料 |',
    '',
    '---',
    '',
    '### 一句話總結',
    '',
    '如果你看得到這段文字、樣式跟捲動都正常，代表畫面這一層沒問題，可以放心去測真的功能。',
  ].join('\n');

  async function send() {
    const question = questionInput.value.trim();
    if (!question || !chartInput) return;

    showQuestionCard(question);
    questionInput.value = '';
    sendBtn.disabled = true;
    showLoading();

    if (isDebugMode) {
      await new Promise((resolve) => setTimeout(resolve, 400));
      showAssistantMessage(DEBUG_ANSWER);
      history.push({ role: 'user', content: question });
      history.push({ role: 'assistant', content: DEBUG_ANSWER });
      sendBtn.disabled = false;
      return;
    }

    try {
      const res = await fetch(`${API_BASE}/api/interpret`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chartInput, question, history }),
      });
      const data = await res.json();

      if (!res.ok) {
        showErrorMessage(data.error || `發生錯誤（HTTP ${res.status}）`);
        return;
      }

      showAssistantMessage(data.answer);
      history.push({ role: 'user', content: question });
      history.push({ role: 'assistant', content: data.answer });
    } catch (err) {
      showErrorMessage('連線失敗，請稍後再試：' + err.message);
    } finally {
      sendBtn.disabled = false;
    }
  }

  sendBtn.addEventListener('click', send);
  questionInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send();
  });

  (function init() {
    const params = new URLSearchParams(location.search);
    const userId = params.get('userId');
    if (!userId) {
      showFatalError('沒有指定使用者，請從命盤頁面的使用者列表點「問問小仙」進入。');
      return;
    }
    const users = loadSavedUsers();
    const user = users.find((u) => u.id === userId);
    if (!user) {
      showFatalError('找不到這個使用者的資料，可能已經被刪除。');
      return;
    }
    whoLabel.textContent = user.name;
    chartInput = buildChartInput(user.birthInfo);
    showEmptyState();
  })();
</script>
</body>
</html>
