<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>問問小仙</title>
<link rel="manifest" href="manifest.json" />
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="紫微小仙" />
<meta name="theme-color" content="#0f1115" />
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --gold: #c9a24b;
    --text: #e8e6e1;
    --muted: #8f93a0;
  }
  * { box-sizing: border-box; }
  .hidden { display: none; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    display: flex;
    flex-direction: column;
    height: 100vh;
    height: 100dvh;
    /* iPhone 的圓角螢幕＋Home Indicator 會吃掉畫面四周。左右兩側的圓角是螢幕
       物理曲面造成的，safe-area-inset-left/right 在直向模式下其實是 0（那兩個
       inset 只反映瀏海／Home Indicator，不反映圓角本身），所以左右要靠加大基礎
       padding 來避開，不能只靠 env()；上下則兩者並用，取較大值。 */
    padding: max(12px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(12px, calc(env(safe-area-inset-bottom) + 6px)) max(18px, env(safe-area-inset-left));
    gap: 10px;
  }
  header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }
  header a {
    color: var(--muted);
    text-decoration: none;
    font-size: 0.85rem;
  }
  header a:hover { color: var(--gold); }
  header h1 {
    font-size: 1rem;
    color: var(--gold);
    margin: 0;
  }
  header .who {
    font-size: 0.8rem;
    color: var(--muted);
    margin-left: auto;
  }

  /* 目前捲動到的那一組問答的題目，固定在上方，不隨內容捲動 */
  #question-card {
    flex: 0 0 auto;
    background: rgba(91, 155, 213, 0.1);
    border: 1px solid #5b9bd5;
    border-radius: 8px;
    padding: 6px 12px;
    font-size: 0.82rem;
    line-height: 1.4;
    white-space: pre-wrap;
  }

  .qa-pair {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .qa-pair + .qa-pair {
    margin-top: 16px;
  }
  .qa-question-row {
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: 6px;
  }
  .qa-question {
    max-width: 78%;
    background: rgba(91, 155, 213, 0.14);
    border: 1px solid #5b9bd5;
    border-radius: 10px;
    padding: 8px 14px;
    font-size: 0.88rem;
    line-height: 1.6;
    white-space: pre-wrap;
    transition: opacity 0.2s;
  }
  .qa-delete-btn {
    flex: 0 0 auto;
    width: 24px;
    height: 24px;
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    border-radius: 999px;
    font-size: 0.72rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .qa-delete-btn:hover {
    border-color: #e07070;
    color: #e07070;
  }
  .qa-question.dim, .qa-answer.dim {
    opacity: 0.32;
    transition: opacity 0.2s;
  }

  #output-area {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .empty-state {
    margin: auto;
    text-align: center;
    max-width: 480px;
    padding: 16px;
  }
  .empty-state p {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 14px;
  }
  .example-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
  }
  .example-chip {
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .example-chip:hover {
    border-color: var(--gold);
    color: var(--gold);
  }

  .msg {
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.92rem;
    line-height: 1.7;
  }
  .msg.error {
    background: rgba(224, 112, 112, 0.12);
    border: 1px solid #e07070;
    color: #e07070;
    margin-top: 12px;
  }
  .msg.loading {
    color: var(--muted);
    font-size: 0.85rem;
    margin: auto;
  }

  .qa-answer {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 0.92rem;
    line-height: 1.7;
    transition: opacity 0.2s;
  }
  .qa-answer h3, .qa-answer h4 {
    color: var(--gold);
    margin: 14px 0 6px;
    font-size: 1rem;
  }
  .qa-answer h3:first-child, .qa-answer h4:first-child { margin-top: 0; }
  .qa-answer p { margin: 8px 0; }
  .qa-answer strong { color: var(--gold); }
  .qa-answer hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  .qa-answer table {
    border-collapse: collapse;
    width: 100%;
    margin: 8px 0;
    font-size: 0.85rem;
  }
  .qa-answer th, .qa-answer td {
    border: 1px solid var(--border);
    padding: 5px 8px;
    text-align: left;
  }
  .qa-answer th { color: var(--gold); }
  .qa-answer ul { margin: 8px 0; padding-left: 20px; }

  #input-area {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 90%;
    max-width: 90%;
    margin: 0 auto;
  }
  #question-input {
    flex: 1;
    min-width: 0;
    resize: none;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 999px;
    padding: 12px 20px;
    font-size: 0.92rem;
    font-family: inherit;
    height: 46px;
    line-height: 1.2;
  }
  #send-btn {
    flex: 0 0 auto;
    background: var(--panel);
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 999px;
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0 20px;
    height: 46px;
  }
  #send-btn:hover { background: rgba(201, 162, 75, 0.12); }
  #send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .copy-full-btn {
    display: block;
    margin: 14px auto 4px;
    background: var(--panel);
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 999px;
    padding: 8px 18px;
    font-size: 0.82rem;
    cursor: pointer;
  }
  .copy-full-btn:hover { background: rgba(201, 162, 75, 0.12); }
  .copy-full-btn.copied { border-color: #70ad47; color: #70ad47; }
</style>
</head>
<body>
  <header>
    <a href="index.html">← 返回命盤</a>
    <h1>✨ 問問小仙</h1>
    <span class="who" id="who-label"></span>
  </header>

  <div id="question-card" class="hidden">
    <span id="question-card-text"></span>
  </div>

  <div id="output-area"></div>

  <div id="input-area">
    <textarea id="question-input" placeholder="輸入問題，例如：幫我論命"></textarea>
    <button type="button" id="send-btn">送出</button>
  </div>

<script>
  const API_BASE = 'https://ziwei-api-henna.vercel.app';
  const STORAGE_KEY = 'ziweiSavedUsers';
  const EXAMPLE_QUESTIONS = [
    '幫我論命',
    '看看我今年的工作運',
    '我的財運如何',
    '我適合什麼樣的伴侶',
    '我的健康需要注意什麼',
    '這十年整體運勢如何',
  ];

  const questionCard = document.getElementById('question-card');
  const questionCardText = document.getElementById('question-card-text');
  const outputArea = document.getElementById('output-area');
  const questionInput = document.getElementById('question-input');
  const sendBtn = document.getElementById('send-btn');
  const whoLabel = document.getElementById('who-label');

  function loadSavedUsers() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (err) {
      return [];
    }
  }

  function buildChartInput(birthInfo) {
    const input = {
      dateType: birthInfo.dateType,
      date: `${birthInfo.year}-${birthInfo.month}-${birthInfo.day}`,
      isLeapMonth: !!birthInfo.isLeapMonth,
      gender: birthInfo.gender,
      birthTime: `${String(birthInfo.birthHour).padStart(2, '0')}:${String(birthInfo.birthMinute).padStart(2, '0')}`,
    };
    const loc = birthInfo.location;
    if (loc && loc.latitude !== undefined && loc.longitude !== undefined && loc.timezoneId) {
      input.location = { latitude: loc.latitude, longitude: loc.longitude, timezoneId: loc.timezoneId };
    }
    return input;
  }

  function showFatalError(message) {
    outputArea.innerHTML = `
      <div class="empty-state">
        <p>${escapeHtml(message)}</p>
        <a class="example-chip" href="index.html">回到命盤頁面</a>
      </div>
    `;
    questionInput.disabled = true;
    sendBtn.disabled = true;
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // 把系統 prompt 會產生的輕量 markdown（###/####標題、**粗體**、---分隔線、
  // | table |、- 條列）轉成簡單的 HTML，不引入外部 markdown 套件。
  function renderAssistantMarkdown(text) {
    const escaped = escapeHtml(text);
    const lines = escaped.split('\n');
    const htmlParts = [];
    let i = 0;
    let inList = false;

    function closeList() {
      if (inList) { htmlParts.push('</ul>'); inList = false; }
    }

    function inline(s) {
      return s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    }

    while (i < lines.length) {
      const line = lines[i];

      if (/^#{3,4}\s+/.test(line)) {
        closeList();
        htmlParts.push(`<h3>${inline(line.replace(/^#{3,4}\s+/, ''))}</h3>`);
        i++;
        continue;
      }
      if (/^-{3,}$/.test(line.trim())) {
        closeList();
        htmlParts.push('<hr>');
        i++;
        continue;
      }
      if (/^\|.*\|$/.test(line.trim())) {
        closeList();
        const tableLines = [];
        while (i < lines.length && /^\|.*\|$/.test(lines[i].trim())) {
          tableLines.push(lines[i].trim());
          i++;
        }
        const rows = tableLines
          .filter((l) => !/^\|[\s-:|]+\|$/.test(l)) // drop the |---|---| separator row
          .map((l) => l.slice(1, -1).split('|').map((c) => c.trim()));
        if (rows.length) {
          const [headerRow, ...bodyRows] = rows;
          htmlParts.push('<table><thead><tr>' +
            headerRow.map((c) => `<th>${inline(c)}</th>`).join('') +
            '</tr></thead><tbody>' +
            bodyRows.map((r) => '<tr>' + r.map((c) => `<td>${inline(c)}</td>`).join('') + '</tr>').join('') +
            '</tbody></table>');
        }
        continue;
      }
      if (/^[-*]\s+/.test(line)) {
        if (!inList) { htmlParts.push('<ul>'); inList = true; }
        htmlParts.push(`<li>${inline(line.replace(/^[-*]\s+/, ''))}</li>`);
        i++;
        continue;
      }
      closeList();
      if (line.trim() === '') { i++; continue; }
      htmlParts.push(`<p>${inline(line)}</p>`);
      i++;
    }
    closeList();
    return htmlParts.join('\n');
  }

  async function copyTextToClipboard(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
      return;
    }
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }

  // ---- 對話紀錄：存在 localStorage，用 userId 分開，永久保存 ----
  const CHAT_STORAGE_KEY = 'ziweiChatHistory';

  function loadChatHistoryMap() {
    try {
      const raw = localStorage.getItem(CHAT_STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : {};
      return parsed && typeof parsed === 'object' ? parsed : {};
    } catch (err) {
      return {};
    }
  }

  function persistEntries() {
    const map = loadChatHistoryMap();
    map[currentUserId] = entries.map(({ question, answer }) => ({ question, answer }));
    localStorage.setItem(CHAT_STORAGE_KEY, JSON.stringify(map));
  }

  // 送給 API 的 history 是從目前的 entries 現算出來的，這樣刪除某一組問答
  // 後，之後的提問自然就不會再帶著被刪掉的內容當上下文。
  function buildApiHistory() {
    return entries.flatMap((e) => [
      { role: 'user', content: e.question },
      { role: 'assistant', content: e.answer },
    ]);
  }

  let chartInput = null;
  let currentUserId = null;
  let entries = []; // [{id, question, answer}]
  let nextEntryId = 1;
  let activeEntryId = null;
  let isSending = false;

  function scrollToBottom() {
    outputArea.scrollTop = outputArea.scrollHeight;
  }

  function setActiveEntry(id) {
    if (id === activeEntryId) return;
    activeEntryId = id;
    entries.forEach((e) => {
      const pairEl = outputArea.querySelector(`.qa-pair[data-id="${e.id}"]`);
      if (!pairEl) return;
      const isActive = e.id === id;
      pairEl.querySelector('.qa-question').classList.toggle('dim', !isActive);
      pairEl.querySelector('.qa-answer').classList.toggle('dim', !isActive);
    });
    const activeEntry = entries.find((e) => e.id === id);
    if (activeEntry) {
      questionCardText.textContent = activeEntry.question;
      questionCard.classList.remove('hidden');
    }
  }

  // 送出新問題後到答案回來前，固定題目區塊要顯示「這個新問題」，且已有的
  // 問答都先變灰暗；這段期間捲動不應該把它蓋回去，所以搭配 isSending 使用。
  function showPendingQuestion(question) {
    activeEntryId = null;
    entries.forEach((e) => {
      const pairEl = outputArea.querySelector(`.qa-pair[data-id="${e.id}"]`);
      if (!pairEl) return;
      pairEl.querySelector('.qa-question').classList.add('dim');
      pairEl.querySelector('.qa-answer').classList.add('dim');
    });
    questionCardText.textContent = question;
    questionCard.classList.remove('hidden');
  }

  // 捲動追蹤：永遠只有一組問答是「正常」，其餘都是「灰暗」。判斷方式是找
  // 「題目區塊頂端已經捲到固定區塊下緣（或更上面）」的最後一組——往下滑會
  // 不斷換成更新的那組，往上滑則會退回上一組，剛好符合預期的行為。
  function updateActiveEntry() {
    if (entries.length === 0 || isSending) return;
    // 已經捲到最底部（或內容根本不夠長需要捲動）時，一律視為「顯示最新一組」，
    // 符合「起始畫面停在最下方＝最新資訊」的預期，不受下面逐項比對結果影響。
    const atBottom = outputArea.scrollTop + outputArea.clientHeight >= outputArea.scrollHeight - 2;
    if (atBottom) {
      setActiveEntry(entries[entries.length - 1].id);
      return;
    }
    const headerBottom = questionCard.getBoundingClientRect().bottom;
    let activeId = entries[0].id;
    for (const e of entries) {
      const pairEl = outputArea.querySelector(`.qa-pair[data-id="${e.id}"]`);
      if (!pairEl) continue;
      const questionEl = pairEl.querySelector('.qa-question');
      if (questionEl.getBoundingClientRect().top <= headerBottom) {
        activeId = e.id;
      }
    }
    setActiveEntry(activeId);
  }

  outputArea.addEventListener('scroll', () => {
    window.requestAnimationFrame(updateActiveEntry);
  });

  function deleteEntry(id) {
    entries = entries.filter((e) => e.id !== id);
    persistEntries();
    if (entries.length === 0) {
      showEmptyState();
      return;
    }
    renderAllEntries();
  }

  function buildQaPairEl(entry) {
    const pair = document.createElement('div');
    pair.className = 'qa-pair';
    pair.dataset.id = String(entry.id);
    pair.innerHTML = `
      <div class="qa-question-row">
        <div class="qa-question dim">${escapeHtml(entry.question)}</div>
        <button type="button" class="qa-delete-btn" title="刪除這組問答">✕</button>
      </div>
      <div class="qa-answer dim">${renderAssistantMarkdown(entry.answer)}</div>
    `;
    pair.querySelector('.qa-delete-btn').addEventListener('click', () => deleteEntry(entry.id));
    return pair;
  }

  function ensureCopyFullBtn() {
    const old = document.getElementById('copy-full-btn');
    if (old) old.remove();
    const copyBtn = document.createElement('button');
    copyBtn.type = 'button';
    copyBtn.className = 'copy-full-btn';
    copyBtn.id = 'copy-full-btn';
    copyBtn.textContent = '📋 複製全文';
    copyBtn.addEventListener('click', async () => {
      const fullText = entries
        .map((e) => `Q：${e.question}\n\nA：${e.answer}`)
        .join('\n\n---\n\n');
      try {
        await copyTextToClipboard(fullText);
        copyBtn.textContent = '已複製 ✓';
        copyBtn.classList.add('copied');
      } catch (err) {
        copyBtn.textContent = '複製失敗';
      }
      setTimeout(() => {
        copyBtn.textContent = '📋 複製全文';
        copyBtn.classList.remove('copied');
      }, 1500);
    });
    outputArea.appendChild(copyBtn);
  }

  function renderAllEntries() {
    outputArea.innerHTML = '';
    entries.forEach((entry) => outputArea.appendChild(buildQaPairEl(entry)));
    ensureCopyFullBtn();
    activeEntryId = null;
    // 必須先取消隱藏固定題目區塊，updateActiveEntry() 才能量到正確的
    // getBoundingClientRect()，否則第一次計算會誤判成 top:0 的隱藏元素。
    questionCard.classList.remove('hidden');
    scrollToBottom();
    updateActiveEntry();
  }

  function appendEntryToDom(entry) {
    if (outputArea.querySelector('.empty-state')) outputArea.innerHTML = '';
    const existingCopyBtn = document.getElementById('copy-full-btn');
    if (existingCopyBtn) existingCopyBtn.remove();
    outputArea.appendChild(buildQaPairEl(entry));
    ensureCopyFullBtn();
    scrollToBottom();
    setActiveEntry(entry.id);
  }

  function showLoading() {
    const el = document.createElement('div');
    el.className = 'msg loading';
    el.id = 'loading-msg';
    el.textContent = '解盤中...';
    outputArea.appendChild(el);
    scrollToBottom();
  }

  function showErrorMessage(text) {
    const loadingEl = document.getElementById('loading-msg');
    if (loadingEl) loadingEl.remove();
    const el = document.createElement('div');
    el.className = 'msg error';
    el.textContent = text;
    outputArea.appendChild(el);
    scrollToBottom();
  }

  function showEmptyState() {
    questionCard.classList.add('hidden');
    outputArea.innerHTML = `
      <div class="empty-state">
        <p>想問什麼都可以，或直接點下面的範例開始：</p>
        <div class="example-chips">
          ${EXAMPLE_QUESTIONS.map((q) => `<button type="button" class="example-chip" data-q="${escapeHtml(q)}">${escapeHtml(q)}</button>`).join('')}
        </div>
      </div>
    `;
    outputArea.querySelectorAll('.example-chip').forEach((btn) => {
      btn.addEventListener('click', () => {
        questionInput.value = btn.dataset.q;
        send();
      });
    });
  }

  async function send() {
    const question = questionInput.value.trim();
    if (!question || !chartInput) return;

    const existingError = outputArea.querySelector('.msg.error');
    if (existingError) existingError.remove();

    questionInput.value = '';
    sendBtn.disabled = true;
    isSending = true;
    showPendingQuestion(question);
    showLoading();

    try {
      const res = await fetch(`${API_BASE}/api/interpret`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ chartInput, question, history: buildApiHistory() }),
      });
      const data = await res.json();
      const loadingEl = document.getElementById('loading-msg');
      if (loadingEl) loadingEl.remove();

      if (!res.ok) {
        showErrorMessage(data.error || `發生錯誤（HTTP ${res.status}）`);
        return;
      }

      const entry = { id: nextEntryId++, question, answer: data.answer };
      entries.push(entry);
      persistEntries();
      appendEntryToDom(entry);
    } catch (err) {
      const loadingEl = document.getElementById('loading-msg');
      if (loadingEl) loadingEl.remove();
      showErrorMessage('連線失敗，請稍後再試：' + err.message);
    } finally {
      sendBtn.disabled = false;
      isSending = false;
      if (activeEntryId === null) {
        // 送出失敗、沒有新增問答，還原成送出前的狀態
        if (entries.length > 0) {
          updateActiveEntry();
        } else {
          questionCard.classList.add('hidden');
        }
      }
    }
  }

  sendBtn.addEventListener('click', send);
  questionInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send();
  });

  (function init() {
    const params = new URLSearchParams(location.search);
    const userId = params.get('userId');
    if (!userId) {
      showFatalError('沒有指定使用者，請從命盤頁面的使用者列表點「問問小仙」進入。');
      return;
    }
    const users = loadSavedUsers();
    const user = users.find((u) => u.id === userId);
    if (!user) {
      showFatalError('找不到這個使用者的資料，可能已經被刪除。');
      return;
    }
    whoLabel.textContent = user.name;
    chartInput = buildChartInput(user.birthInfo);
    currentUserId = userId;

    const savedEntries = loadChatHistoryMap()[userId] || [];
    if (savedEntries.length > 0) {
      entries = savedEntries.map((e) => ({ id: nextEntryId++, question: e.question, answer: e.answer }));
      renderAllEntries();
    } else {
      showEmptyState();
    }
  })();
</script>
</body>
</html>
