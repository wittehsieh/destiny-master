<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>紫微斗數排盤</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --gold: #c9a24b;
    --text: #e8e6e1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    padding: 16px;
  }
  h1 {
    font-size: 1.3rem;
    color: var(--gold);
    text-align: center;
    margin: 0 0 16px;
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px;
    margin: 0 auto 16px;
    max-width: 900px;
  }
  form {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 0.85rem;
  }
  .field.checkbox {
    flex-direction: row;
    align-items: center;
    gap: 6px;
  }
  .field.full-width {
    flex-basis: 100%;
  }
  .date-select-row {
    display: flex;
    gap: 6px;
  }
  .date-select-row select {
    min-width: 0;
  }
  #year { flex: 1.3; }
  #month { flex: 1; }
  #day { flex: 1; }

  .location-select-row {
    display: flex;
    gap: 6px;
    margin-bottom: 6px;
  }
  .location-select-row select {
    flex: 1;
    min-width: 0;
  }
  #citySearch {
    width: 100%;
    margin-bottom: 6px;
  }
  #city {
    width: 100%;
  }
  .solar-time-panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 16px;
    font-size: 0.85rem;
  }
  .solar-time-panel span.label {
    color: var(--gold);
    margin-right: 4px;
  }
  @media (max-width: 640px) {
    .solar-time-panel {
      grid-template-columns: 1fr;
    }
  }
  input, select {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 6px 8px;
    font-size: 0.9rem;
  }
  button {
    background: var(--gold);
    color: #1a1a1a;
    border: none;
    border-radius: 4px;
    padding: 8px 20px;
    font-size: 0.95rem;
    font-weight: bold;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .error {
    color: #e07070;
    margin-top: 8px;
    font-size: 0.85rem;
  }
  .hidden { display: none !important; }

  .chart-wrap {
    max-width: 1160px;
    margin: 0 auto 16px;
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    align-items: flex-start;
  }
  .chart-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, minmax(140px, auto));
    gap: 4px;
    aspect-ratio: 1 / 1;
    flex: 1 1 560px;
    max-width: 800px;
  }
  .palace-info-panel {
    flex: 1 1 260px;
    max-width: 320px;
    position: sticky;
    top: 16px;
    margin: 0;
  }
  .palace-info-panel h2 {
    font-size: 1rem;
    color: var(--gold);
    margin: 0 0 10px;
  }
  #palace-info-content {
    font-size: 0.85rem;
    line-height: 1.7;
    color: #b7bccb;
  }
  #palace-info-content .info-title {
    color: var(--gold);
    font-weight: bold;
    font-size: 0.95rem;
    display: block;
    margin-bottom: 6px;
  }
  .palace {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px;
    font-size: 0.72rem;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    cursor: default;
    transition: border-color 0.15s, background 0.15s;
  }
  .palace:hover {
    border-color: var(--gold);
    background: #1d2029;
  }
  .palace-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid var(--border);
    padding-bottom: 3px;
    margin-bottom: 3px;
  }
  .palace-name {
    color: var(--gold);
    font-weight: bold;
    font-size: 0.85rem;
  }
  .palace-stem-branch {
    font-size: 0.7rem;
    color: #8f93a0;
  }
  .body-tag {
    color: #e07070;
    font-size: 0.65rem;
    margin-left: 4px;
  }
  .major-star {
    color: var(--text);
    font-weight: bold;
  }
  .star-line {
    margin-bottom: 1px;
    line-height: 1.25;
  }
  .brightness {
    color: #8f93a0;
    font-size: 0.65rem;
  }
  .mutagen {
    display: inline-block;
    margin-left: 2px;
    padding: 0 3px;
    border-radius: 3px;
    font-size: 0.6rem;
    background: var(--gold);
    color: #1a1a1a;
  }
  .minor-star { color: #b7bccb; }
  .adjective-star { color: #6d7180; font-size: 0.65rem; }

  .center-info {
    grid-column: 2 / span 2;
    grid-row: 2 / span 2;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 6px;
    font-size: 0.78rem;
  }
  .center-info div span.label {
    color: var(--gold);
    margin-right: 4px;
  }
  .horoscope-toggle-row {
    display: flex;
    gap: 6px;
    margin-top: 4px;
    flex-wrap: wrap;
  }
  .horoscope-toggle {
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 4px;
    padding: 4px 10px;
    font-size: 0.72rem;
    font-weight: normal;
    cursor: pointer;
  }
  .horoscope-toggle.active {
    font-weight: bold;
  }
  .horoscope-toggle[data-scope="decadal"].active {
    border-color: #e0a53b;
    color: #e0a53b;
    background: rgba(224, 165, 59, 0.15);
  }
  .horoscope-toggle[data-scope="yearly"].active {
    border-color: #5b9bd5;
    color: #5b9bd5;
    background: rgba(91, 155, 213, 0.15);
  }
  .horoscope-toggle[data-scope="monthly"].active {
    border-color: #70ad47;
    color: #70ad47;
    background: rgba(112, 173, 71, 0.15);
  }
  .horoscope-toggle[data-scope="daily"].active {
    border-color: #b57edc;
    color: #b57edc;
    background: rgba(181, 126, 220, 0.15);
  }
  #horoscope-legend {
    font-size: 0.66rem;
    line-height: 1.5;
  }
  .horoscope-overlay {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-top: 3px;
  }
  .horoscope-tag {
    font-size: 0.6rem;
    border: 1px solid;
    border-radius: 3px;
    padding: 1px 4px;
    line-height: 1.4;
  }
  .horoscope-scope-label {
    font-weight: bold;
    margin-right: 3px;
  }

  @media (max-width: 640px) {
    body { padding: 10px; }
    .panel { padding: 12px; }

    /* 輸入資訊區、命盤區、說明區、純文字區：填滿左右、垂直依序排列 */
    .chart-wrap {
      flex-direction: column;
      gap: 10px;
    }
    .chart-grid,
    .palace-info-panel {
      flex-basis: auto;
      width: 100%;
      max-width: 100%;
    }
    .palace-info-panel {
      position: static;
    }

    .chart-grid {
      /* 由內容決定高度，避免 aspect-ratio 硬性壓縮造成文字重疊/裁切 */
      aspect-ratio: auto;
      grid-template-rows: repeat(4, minmax(0, auto));
      gap: 3px;
    }
    .palace {
      font-size: 0.62rem;
      padding: 4px 3px;
      overflow: visible;
      word-break: break-word;
    }
    .palace-header {
      flex-wrap: wrap;
      row-gap: 2px;
    }
    .palace-name { font-size: 0.7rem; }
    .palace-stem-branch { font-size: 0.6rem; }
    .brightness { font-size: 0.56rem; }
    .mutagen { font-size: 0.52rem; padding: 0 2px; }
    .adjective-star { font-size: 0.56rem; }
    .body-tag { font-size: 0.56rem; }

    .center-info { font-size: 0.66rem; padding: 8px; gap: 4px; }
    .horoscope-toggle { font-size: 0.66rem; padding: 3px 8px; }
    #horoscope-legend { font-size: 0.58rem; }
    .horoscope-tag { font-size: 0.54rem; }

    #palace-info-content { font-size: 0.8rem; }
  }

  @media (max-width: 400px) {
    .palace { font-size: 0.56rem; padding: 3px 2px; }
    .palace-name { font-size: 0.64rem; }
    .palace-stem-branch { font-size: 0.54rem; }
    .brightness { font-size: 0.5rem; }
    .mutagen { font-size: 0.48rem; }
    .adjective-star { font-size: 0.5rem; }
    .chart-grid { gap: 2px; }
  }

  .copy-chart-btn, .save-chart-btn {
    background: transparent;
    color: var(--gold);
    border: 1px solid var(--gold);
    border-radius: 4px;
    padding: 6px 14px;
    font-size: 0.85rem;
    font-weight: normal;
    cursor: pointer;
    white-space: nowrap;
  }
  .copy-chart-btn:hover, .save-chart-btn:hover { opacity: 0.85; }
  .copy-chart-btn.copied, .save-chart-btn.copied {
    background: var(--gold);
    color: #1a1a1a;
  }
  .chart-actions {
    max-width: 1160px;
    margin: 0 auto 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }
  #save-status {
    font-size: 0.8rem;
    color: #e07070;
    align-self: center;
  }
  .name-row {
    display: flex;
    gap: 8px;
  }
  .name-row input {
    flex: 1;
    min-width: 0;
  }
  .name-row .save-chart-btn {
    flex: 0 0 auto;
  }

  /* ---- 八字 ---- */
  .bazi-panel {
    max-width: 1160px;
  }
  .bazi-panel h2 {
    font-size: 1.05rem;
    color: var(--gold);
    margin: 0 0 10px;
  }
  #bazi-content {
    margin-top: 10px;
    min-height: 20px;
  }
  .bazi-copy-btn {
    margin-top: 12px;
  }
  .bazi-grid {
    display: grid;
    grid-template-columns: repeat(6, minmax(0, 1fr));
    gap: 6px;
  }
  .bazi-cell {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 4px;
    text-align: center;
    min-width: 0;
  }
  .bazi-cell-title {
    background: transparent;
    border: none;
    color: var(--gold);
    font-size: 0.72rem;
    font-weight: bold;
    padding: 0 2px 6px;
    word-break: break-word;
  }
  .bazi-char {
    font-size: 1.3rem;
    font-weight: bold;
  }
  .bazi-shishen {
    font-size: 0.7rem;
    color: #8f93a0;
    margin-top: 4px;
    word-break: break-word;
  }

  @media (max-width: 640px) {
    .bazi-grid {
      gap: 3px;
    }
    .bazi-cell { padding: 5px 2px; }
    .bazi-cell-title { font-size: 0.56rem; padding-bottom: 4px; }
    .bazi-char { font-size: 0.95rem; }
    .bazi-shishen { font-size: 0.54rem; }
  }

  /* ---- 使用者列表 / 開始畫面 ---- */
  .user-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 12px;
  }
  .user-list-row {
    display: flex;
    gap: 6px;
    align-items: stretch;
  }
  .user-list-item {
    flex: 1;
    min-width: 0;
    display: block;
    width: 100%;
    text-align: left;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 1rem;
    cursor: pointer;
  }
  .user-list-item:hover {
    border-color: var(--gold);
    color: var(--gold);
  }
  .user-list-name {
    display: block;
    font-weight: bold;
  }
  .user-list-meta {
    display: block;
    font-size: 0.75rem;
    color: #8f93a0;
    margin-top: 2px;
  }
  .user-ai-btn {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold);
    border-radius: 6px;
    padding: 0 14px;
    font-size: 0.85rem;
    cursor: pointer;
    text-decoration: none;
    display: flex;
    align-items: center;
  }
  .user-ai-btn:hover {
    background: rgba(201, 162, 75, 0.12);
  }
  .user-delete-btn {
    flex: 0 0 auto;
    background: transparent;
    border: 1px solid var(--border);
    color: #e07070;
    border-radius: 6px;
    padding: 0 14px;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .user-delete-btn:hover {
    border-color: #e07070;
    background: rgba(224, 112, 112, 0.1);
  }
  .new-user-btn {
    width: 100%;
  }
  .empty-user-hint {
    color: #8f93a0;
    font-size: 0.85rem;
    margin-bottom: 12px;
  }
  .back-to-list-btn {
    background: transparent;
    border: none;
    color: var(--gold);
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0 0 12px;
    text-decoration: underline;
  }
  .back-to-list-btn:hover { opacity: 0.85; }

  /* ---- Modal ---- */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  .modal-box {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px;
    max-width: 360px;
    width: 100%;
    text-align: center;
  }
  .modal-box p {
    margin: 0 0 20px;
    font-size: 0.95rem;
    line-height: 1.6;
  }
  .modal-actions {
    display: flex;
    gap: 10px;
    justify-content: center;
  }
  .modal-actions button {
    flex: 1;
    max-width: 140px;
  }
  .modal-btn-secondary {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text);
  }
</style>
</head>
<body>
  <h1>紫微斗數排盤</h1>

  <div class="panel" id="start-screen">
    <div class="user-list" id="user-list"></div>
    <div class="empty-user-hint hidden" id="empty-user-hint">本機還沒有儲存過的使用者，按下方新增一位。</div>
    <button type="button" class="new-user-btn" id="new-user-btn">+ 新增使用者</button>
  </div>

  <div id="main-screen" class="hidden">
  <button type="button" class="back-to-list-btn" id="back-to-list-btn">← 返回使用者列表</button>

  <div class="panel">
    <form id="chart-form">
      <div class="field full-width">
        <label for="userName">姓名</label>
        <div class="name-row">
          <input type="text" id="userName" placeholder="用來儲存與辨識這筆資料" autocomplete="off" />
          <button type="button" class="save-chart-btn" id="save-chart-btn">💾 儲存</button>
        </div>
        <span id="save-status"></span>
      </div>
      <div class="field">
        <label for="dateType">曆別</label>
        <select id="dateType">
          <option value="solar">陽曆</option>
          <option value="lunar">農曆</option>
        </select>
      </div>
      <div class="field">
        <label>出生日期</label>
        <div class="date-select-row">
          <select id="year" required></select>
          <select id="month" required></select>
          <select id="day" required></select>
        </div>
      </div>
      <div class="field checkbox hidden" id="leap-field">
        <input type="checkbox" id="isLeapMonth" />
        <label for="isLeapMonth">閏月</label>
      </div>
      <div class="field">
        <label>出生時間</label>
        <div class="date-select-row">
          <select id="birthHour" required></select>
          <select id="birthMinute" required></select>
        </div>
      </div>
      <div class="field">
        <label for="gender">性別</label>
        <select id="gender">
          <option value="女">女</option>
          <option value="男">男</option>
        </select>
      </div>
      <div class="field full-width">
        <label>出生地</label>
        <div class="location-select-row">
          <select id="continent" required></select>
          <select id="country" required></select>
        </div>
        <input type="text" id="citySearch" placeholder="🔍 搜尋城市" autocomplete="off" />
        <select id="city" required></select>
      </div>
      <div class="field full-width">
        <div class="solar-time-panel" id="solar-time-panel">
          <div><span class="label">出生時間</span><span id="result-civil-time">--</span></div>
          <div><span class="label">出生地</span><span id="result-location">--</span></div>
          <div><span class="label">真太陽時</span><span id="result-true-solar">請選擇出生地</span></div>
          <div><span class="label">時間修正</span><span id="result-correction">--</span></div>
        </div>
      </div>
      <button type="submit">開始排盤</button>
    </form>
    <div class="error hidden" id="error-msg"></div>
  </div>

  <div class="chart-wrap">
    <div class="chart-grid hidden" id="chart-grid"></div>
    <div class="panel palace-info-panel hidden" id="palace-info-panel">
      <h2>宮位說明</h2>
      <div id="palace-info-content">將游標移到宮位上查看該宮對人生的影響</div>
    </div>
  </div>

  <div class="chart-actions hidden" id="chart-actions">
    <button type="button" class="copy-chart-btn" id="copy-chart-btn">📋 一鍵複製（命盤＋大限流年流月流日）</button>
  </div>

  <div class="panel bazi-panel hidden" id="bazi-section">
    <h2>八字</h2>
    <div id="bazi-content"></div>
    <button type="button" class="copy-chart-btn bazi-copy-btn" id="copy-bazi-btn">📋 一鍵複製八字</button>
  </div>

  </div><!-- /#main-screen -->

  <div class="modal-backdrop hidden" id="overwrite-modal">
    <div class="modal-box">
      <p id="overwrite-modal-text"></p>
      <div class="modal-actions">
        <button type="button" class="modal-btn-secondary" id="overwrite-cancel-btn">取消</button>
        <button type="button" id="overwrite-confirm-btn">確定覆蓋</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="success-modal">
    <div class="modal-box">
      <p>已儲存！</p>
      <div class="modal-actions">
        <button type="button" id="success-ok-btn">好</button>
      </div>
    </div>
  </div>

<script src="iztro.min.js"></script>
<script src="astronomy.browser.min.js"></script>
<script src="location-data.js"></script>
<script src="solar-time.js"></script>
<script src="lunar-typescript.min.js"></script>
<script>
  const dateTypeSelect = document.getElementById('dateType');
  const leapField = document.getElementById('leap-field');
  const form = document.getElementById('chart-form');
  const errorMsg = document.getElementById('error-msg');
  const chartGrid = document.getElementById('chart-grid');
  const palaceInfoPanel = document.getElementById('palace-info-panel');
  const nameInput = document.getElementById('userName');
  const startScreen = document.getElementById('start-screen');
  const mainScreen = document.getElementById('main-screen');
  const userListEl = document.getElementById('user-list');
  const emptyUserHint = document.getElementById('empty-user-hint');
  const newUserBtn = document.getElementById('new-user-btn');
  const backToListBtn = document.getElementById('back-to-list-btn');
  const chartActions = document.getElementById('chart-actions');
  const copyChartBtn = document.getElementById('copy-chart-btn');
  const saveChartBtn = document.getElementById('save-chart-btn');
  const saveStatus = document.getElementById('save-status');
  const overwriteModal = document.getElementById('overwrite-modal');
  const overwriteModalText = document.getElementById('overwrite-modal-text');
  const overwriteConfirmBtn = document.getElementById('overwrite-confirm-btn');
  const overwriteCancelBtn = document.getElementById('overwrite-cancel-btn');
  const successModal = document.getElementById('success-modal');
  const successOkBtn = document.getElementById('success-ok-btn');
  const baziSection = document.getElementById('bazi-section');
  const baziContent = document.getElementById('bazi-content');
  const copyBaziBtn = document.getElementById('copy-bazi-btn');

  dateTypeSelect.addEventListener('change', () => {
    leapField.classList.toggle('hidden', dateTypeSelect.value !== 'lunar');
    updateDayOptions();
  });

  const yearSelect = document.getElementById('year');
  const monthSelect = document.getElementById('month');
  const daySelect = document.getElementById('day');

  const CURRENT_YEAR = new Date().getFullYear();
  const MIN_YEAR = 1900;

  for (let y = CURRENT_YEAR; y >= MIN_YEAR; y--) {
    const opt = document.createElement('option');
    opt.value = y;
    opt.textContent = `${y}年`;
    yearSelect.appendChild(opt);
  }
  for (let m = 1; m <= 12; m++) {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = `${m}月`;
    monthSelect.appendChild(opt);
  }

  function isSolarLeapYear(year) {
    return (year % 4 === 0 && year % 100 !== 0) || year % 400 === 0;
  }

  function daysInSolarMonth(year, month) {
    const days = [31, isSolarLeapYear(year) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    return days[month - 1];
  }

  function updateDayOptions() {
    const isLunar = dateTypeSelect.value === 'lunar';
    const maxDay = isLunar ? 30 : daysInSolarMonth(Number(yearSelect.value), Number(monthSelect.value));
    const prevValue = Number(daySelect.value) || 1;

    daySelect.innerHTML = '';
    for (let d = 1; d <= maxDay; d++) {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = `${d}日`;
      daySelect.appendChild(opt);
    }
    daySelect.value = Math.min(prevValue, maxDay);
  }

  yearSelect.value = CURRENT_YEAR - 30;
  monthSelect.value = 1;
  updateDayOptions();

  yearSelect.addEventListener('change', updateDayOptions);
  monthSelect.addEventListener('change', updateDayOptions);

  const HOUR_OPTIONS = [
    { value: 0, branch: '早子', range: '00:00–01:00' },
    { value: 1, branch: '丑', range: '01:00–03:00' },
    { value: 2, branch: '寅', range: '03:00–05:00' },
    { value: 3, branch: '卯', range: '05:00–07:00' },
    { value: 4, branch: '辰', range: '07:00–09:00' },
    { value: 5, branch: '巳', range: '09:00–11:00' },
    { value: 6, branch: '午', range: '11:00–13:00' },
    { value: 7, branch: '未', range: '13:00–15:00' },
    { value: 8, branch: '申', range: '15:00–17:00' },
    { value: 9, branch: '酉', range: '17:00–19:00' },
    { value: 10, branch: '戌', range: '19:00–21:00' },
    { value: 11, branch: '亥', range: '21:00–23:00' },
    { value: 12, branch: '晚子', range: '23:00–00:00' },
  ];

  // ---- 出生地選擇（洲 -> 國家 -> 城市）與真太陽時計算 ----

  const continentSelect = document.getElementById('continent');
  const countrySelect = document.getElementById('country');
  const citySelect = document.getElementById('city');
  const citySearchInput = document.getElementById('citySearch');
  const birthHourSelect = document.getElementById('birthHour');
  const birthMinuteSelect = document.getElementById('birthMinute');
  const resultCivilTime = document.getElementById('result-civil-time');
  const resultLocation = document.getElementById('result-location');
  const resultTrueSolar = document.getElementById('result-true-solar');
  const resultCorrection = document.getElementById('result-correction');

  for (let h = 0; h < 24; h++) {
    const opt = document.createElement('option');
    opt.value = h;
    opt.textContent = `${String(h).padStart(2, '0')} 時`;
    birthHourSelect.appendChild(opt);
  }
  for (let m = 0; m < 60; m++) {
    const opt = document.createElement('option');
    opt.value = m;
    opt.textContent = `${String(m).padStart(2, '0')} 分`;
    birthMinuteSelect.appendChild(opt);
  }
  birthHourSelect.value = 12;
  birthMinuteSelect.value = 0;

  function getBirthTimeString() {
    return `${String(birthHourSelect.value).padStart(2, '0')}:${String(birthMinuteSelect.value).padStart(2, '0')}`;
  }

  const CONTINENT_ORDER = ['Asia', 'Europe', 'North America', 'South America', 'Africa', 'Oceania'];

  function uniqueBy(rows, keyFn) {
    const seen = new Map();
    rows.forEach((row) => {
      const key = keyFn(row);
      if (!seen.has(key)) seen.set(key, row);
    });
    return [...seen.values()];
  }

  function populateContinents() {
    const present = new Set(window.LOCATION_DATA.map((r) => r[0]));
    const continents = CONTINENT_ORDER.filter((c) => present.has(c));
    continentSelect.innerHTML = continents
      .map((c) => {
        const row = window.LOCATION_DATA.find((r) => r[0] === c);
        return `<option value="${c}">${row[1]}</option>`;
      })
      .join('');
  }

  function populateCountries(preferredCountry) {
    const rows = window.LOCATION_DATA.filter((r) => r[0] === continentSelect.value);
    const countries = uniqueBy(rows, (r) => r[2])
      .sort((a, b) => a[3].localeCompare(b[3], 'zh-Hant'));
    countrySelect.innerHTML = countries
      .map((r) => `<option value="${r[2]}">${r[3]}</option>`)
      .join('');
    if (preferredCountry && countries.some((r) => r[2] === preferredCountry)) {
      countrySelect.value = preferredCountry;
    }
  }

  function populateCities(preferredCity) {
    const searchTerm = citySearchInput.value.trim().toLowerCase();
    const rows = window.LOCATION_DATA
      .map((r, idx) => ({ row: r, idx }))
      .filter(({ row }) => row[0] === continentSelect.value && row[2] === countrySelect.value)
      .filter(({ row }) => !searchTerm || row[4].toLowerCase().includes(searchTerm) || row[5].toLowerCase().includes(searchTerm));

    citySelect.innerHTML = rows
      .map(({ row, idx }) => `<option value="${idx}">${row[5]}</option>`)
      .join('');

    if (rows.length === 0) return;
    const preferredIdx = rows.find(({ row }) => row[4] === preferredCity);
    citySelect.value = preferredIdx ? String(preferredIdx.idx) : String(rows[0].idx);
  }

  function getSelectedLocation() {
    const idx = Number(citySelect.value);
    const row = window.LOCATION_DATA[idx];
    if (!row) return null;
    return {
      continent: row[0], continentZh: row[1],
      country: row[2], countryZh: row[3],
      city: row[4], cityZh: row[5],
      province: row[6], latitude: row[7], longitude: row[8], timezoneId: row[9],
    };
  }

  let lastSolarTimeResult = null;

  function resolveGregorianBirthDate() {
    const year = Number(yearSelect.value);
    const month = Number(monthSelect.value);
    const day = Number(daySelect.value);
    if (dateTypeSelect.value !== 'lunar') {
      return { year, month, day };
    }
    // Lunar date selected: resolve to the equivalent Gregorian date first,
    // since true solar time needs a real Gregorian calendar date. This
    // reuses the existing (unmodified) chart engine purely to read back
    // its resolved `.solarDate` -- it does not affect the actual chart.
    const isLeapMonth = document.getElementById('isLeapMonth').checked;
    const astrolabeRaw = computeAstrolabe({
      dateType: 'lunar',
      date: `${year}-${month}-${day}`,
      hour: 0,
      gender: '女',
      isLeapMonth,
      useTrueSolarTime: false,
      lang: 'zh-TW',
    });
    const [sy, sm, sd] = astrolabeRaw.solarDate.split('-').map(Number);
    return { year: sy, month: sm, day: sd };
  }

  function recomputeSolarTime() {
    const location = getSelectedLocation();
    const timeValue = getBirthTimeString();

    resultCivilTime.textContent = `${yearSelect.value}/${monthSelect.value}/${daySelect.value} ${timeValue || '--:--'}`;
    resultLocation.textContent = location ? `${location.countryZh}・${location.cityZh}` : '--';

    if (!location || !timeValue) {
      resultTrueSolar.textContent = location ? '請輸入出生時間' : '請選擇出生地';
      resultCorrection.textContent = '--';
      lastSolarTimeResult = null;
      return;
    }

    const [hh, mm] = timeValue.split(':').map(Number);

    try {
      const birthDate = resolveGregorianBirthDate();
      const result = SolarTime.calculateTrueSolarTime(birthDate, { hour: hh, minute: mm }, location);
      const tsH = String(result.trueSolarHour).padStart(2, '0');
      const tsM = String(result.trueSolarMinute).padStart(2, '0');
      const hourOpt = HOUR_OPTIONS.find((o) => o.value === result.hourIndex);

      resultTrueSolar.textContent = `${tsH}:${tsM}${hourOpt ? `（${hourOpt.branch}時）` : ''}`;
      resultCorrection.textContent = `${result.correctionMinutes >= 0 ? '+' : ''}${result.correctionMinutes} 分鐘`;
      lastSolarTimeResult = result;
    } catch (err) {
      resultTrueSolar.textContent = '計算失敗：' + (err.message || '');
      resultCorrection.textContent = '--';
      lastSolarTimeResult = null;
    }
  }

  populateContinents();
  continentSelect.value = 'Asia';
  populateCountries('Taiwan');
  populateCities('Taipei');

  continentSelect.addEventListener('change', () => {
    populateCountries();
    citySearchInput.value = '';
    populateCities();
    recomputeSolarTime();
  });
  countrySelect.addEventListener('change', () => {
    citySearchInput.value = '';
    populateCities();
    recomputeSolarTime();
  });
  citySearchInput.addEventListener('input', () => {
    populateCities();
    recomputeSolarTime();
  });
  citySelect.addEventListener('change', recomputeSolarTime);
  birthHourSelect.addEventListener('change', recomputeSolarTime);
  birthMinuteSelect.addEventListener('change', recomputeSolarTime);
  yearSelect.addEventListener('change', recomputeSolarTime);
  monthSelect.addEventListener('change', recomputeSolarTime);
  daySelect.addEventListener('change', recomputeSolarTime);
  dateTypeSelect.addEventListener('change', recomputeSolarTime);
  document.getElementById('isLeapMonth').addEventListener('change', recomputeSolarTime);

  recomputeSolarTime();

  async function copyTextToClipboard(text) {
    if (navigator.clipboard && window.isSecureContext) {
      await navigator.clipboard.writeText(text);
    } else {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
  }

  let currentPayload = null;
  let currentAstrolabe = null;
  let horoscopeState = { decadal: false, yearly: false, monthly: false, daily: false };

  const SCOPE_CONFIG = {
    decadal: { label: '大限', color: '#e0a53b' },
    yearly: { label: '流年', color: '#5b9bd5' },
    monthly: { label: '流月', color: '#70ad47' },
    daily: { label: '流日', color: '#b57edc' },
  };
  const MUTAGEN_LABELS = ['祿', '權', '科', '忌'];

  const palaceInfoContent = document.getElementById('palace-info-content');
  const DEFAULT_PALACE_INFO = '將游標移到宮位上查看該宮對人生的影響';

  function showPalaceInfo(palace) {
    const meaning = PALACE_MEANINGS[palace.name] || '';
    palaceInfoContent.innerHTML = `
      <span class="info-title">${escapeHtml(palace.name)}${palace.isBodyPalace ? '（身宮）' : ''}</span>
      ${escapeHtml(meaning)}
    `;
  }

    palaceInfoContent.textContent = DEFAULT_PALACE_INFO;
  }

  const BRANCH_POSITION = {
    '巳': { col: 1, row: 1 },
    '午': { col: 2, row: 1 },
    '未': { col: 3, row: 1 },
    '申': { col: 4, row: 1 },
    '辰': { col: 1, row: 2 },
    '酉': { col: 4, row: 2 },
    '卯': { col: 1, row: 3 },
    '戌': { col: 4, row: 3 },
    '寅': { col: 1, row: 4 },
    '丑': { col: 2, row: 4 },
    '子': { col: 3, row: 4 },
    '亥': { col: 4, row: 4 },
  };

  // ---- 排盤邏輯（原本在 server.js，現在直接在瀏覽器端用 iztro 瀏覽器版計算） ----

  function mapStar(star) {
    return {
      name: star.name,
      brightness: star.brightness || null,
      mutagen: star.mutagen || null,
    };
  }

  function simplifyAstrolabe(astrolabe) {
    return {
      gender: astrolabe.gender,
      solarDate: astrolabe.solarDate,
      lunarDate: astrolabe.lunarDate,
      chineseDate: astrolabe.chineseDate,
      zodiac: astrolabe.zodiac,
      sign: astrolabe.sign,
      fiveElementsClass: astrolabe.fiveElementsClass,
      soul: astrolabe.soul,
      body: astrolabe.body,
      palaces: astrolabe.palaces.map((palace) => ({
        index: palace.index,
        name: palace.name,
        isBodyPalace: palace.isBodyPalace,
        isOriginalPalace: palace.isOriginalPalace,
        heavenlyStem: palace.heavenlyStem,
        earthlyBranch: palace.earthlyBranch,
        decadalRange: palace.decadal ? palace.decadal.range : null,
        majorStars: (palace.majorStars || []).map(mapStar),
        minorStars: (palace.minorStars || []).map((s) => s.name),
        adjectiveStars: (palace.adjectiveStars || []).map((s) => s.name),
      })),
    };
  }

  function simplifyHoroscopeItem(item) {
    return {
      heavenlyStem: item.heavenlyStem,
      earthlyBranch: item.earthlyBranch,
      index: item.index,
      palaceNames: item.palaceNames,
      mutagen: item.mutagen,
      stars: (item.stars || []).map((palaceStars) => palaceStars.map(mapStar)),
    };
  }

  function computeAstrolabe({ dateType, date, hour, gender, isLeapMonth, useTrueSolarTime, lang }) {
    const { astro } = iztro;
    return dateType === 'lunar'
      ? astro.byLunar(date, hour, gender, isLeapMonth, useTrueSolarTime, lang)
      : astro.bySolar(date, hour, gender, useTrueSolarTime, lang);
  }

  // ---- 表單送出：直接在瀏覽器端排盤，不再打 API ----

  function runChart() {
    errorMsg.classList.add('hidden');

    if (!lastSolarTimeResult) {
      errorMsg.textContent = '請完整選擇出生地與出生時間，系統才能算出真太陽時';
      errorMsg.classList.remove('hidden');
      return;
    }

    const hourValue = lastSolarTimeResult.hourIndex;

    const payload = {
      dateType: dateTypeSelect.value,
      date: `${yearSelect.value}-${monthSelect.value}-${daySelect.value}`,
      hour: hourValue,
      gender: document.getElementById('gender').value,
      isLeapMonth: document.getElementById('isLeapMonth').checked,
      // 已經自行用真太陽時修正過 hour，不要讓 iztro 再套用一次簡化版修正
      useTrueSolarTime: false,
      lang: 'zh-TW',
    };

    try {
      const astrolabeRaw = computeAstrolabe(payload);
      const astrolabe = simplifyAstrolabe(astrolabeRaw);

      currentPayload = payload;
      currentAstrolabe = astrolabe;
      renderChart(astrolabe);

      computeBazi();
      updateBaziContent();
      baziSection.classList.remove('hidden');
    } catch (err) {
      errorMsg.textContent = err.message || '排盤失敗';
      errorMsg.classList.remove('hidden');
      chartGrid.classList.add('hidden');
      palaceInfoPanel.classList.add('hidden');
      chartActions.classList.add('hidden');
      resetBaziSection();
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    runChart();
  });

  function renderChart(astrolabe) {
    chartGrid.innerHTML = '';
    chartGrid.classList.remove('hidden');
    palaceInfoPanel.classList.remove('hidden');
    chartActions.classList.remove('hidden');

    const centerInfo = document.createElement('div');
    centerInfo.className = 'center-info';
    centerInfo.innerHTML = `
      <div><span class="label">陽曆生日</span>${escapeHtml(astrolabe.solarDate || '')}</div>
      <div><span class="label">農曆生日</span>${escapeHtml(astrolabe.lunarDate || '')} ${escapeHtml(astrolabe.chineseDate || '')}</div>
      <div><span class="label">性別/生肖/星座</span>${escapeHtml(astrolabe.gender || '')} / ${escapeHtml(astrolabe.zodiac || '')} / ${escapeHtml(astrolabe.sign || '')}</div>
      <div><span class="label">五行局</span>${escapeHtml(astrolabe.fiveElementsClass || '')}</div>
      <div><span class="label">命主/身主</span>${escapeHtml(astrolabe.soul || '')} / ${escapeHtml(astrolabe.body || '')}</div>
      <div class="horoscope-toggle-row">
        <button type="button" class="horoscope-toggle" data-scope="decadal">大限</button>
        <button type="button" class="horoscope-toggle" data-scope="yearly">流年</button>
        <button type="button" class="horoscope-toggle" data-scope="monthly">流月</button>
        <button type="button" class="horoscope-toggle" data-scope="daily">流日</button>
      </div>
      <div id="horoscope-legend"></div>
    `;
    chartGrid.appendChild(centerInfo);

    horoscopeState = { decadal: false, yearly: false, monthly: false, daily: false };
    centerInfo.querySelectorAll('.horoscope-toggle').forEach((btn) => {
      btn.addEventListener('click', () => {
        const scope = btn.dataset.scope;
        horoscopeState[scope] = !horoscopeState[scope];
        btn.classList.toggle('active', horoscopeState[scope]);
        updateHoroscopeOverlay();
      });
    });

    (astrolabe.palaces || []).forEach((palace) => {
      const pos = BRANCH_POSITION[palace.earthlyBranch];
      const cell = document.createElement('div');
      cell.className = 'palace';
      if (pos) {
        cell.style.gridColumn = String(pos.col);
        cell.style.gridRow = String(pos.row);
      }

      const majorStarsHtml = (palace.majorStars || []).map((s) => `
        <div class="star-line major-star">
          ${escapeHtml(s.name)}
          ${s.brightness ? `<span class="brightness">${escapeHtml(s.brightness)}</span>` : ''}
          ${s.mutagen ? `<span class="mutagen">${escapeHtml(s.mutagen)}</span>` : ''}
        </div>
      `).join('');

      const minorStarsHtml = (palace.minorStars || []).map((name) => `
        <div class="star-line minor-star">${escapeHtml(name)}</div>
      `).join('');

      const adjectiveStarsHtml = (palace.adjectiveStars || []).length
        ? `<div class="star-line adjective-star">${palace.adjectiveStars.map(escapeHtml).join(' ')}</div>`
        : '';

      cell.innerHTML = `
        <div class="palace-header">
          <span class="palace-name">${escapeHtml(palace.name)}${palace.isBodyPalace ? '<span class="body-tag">身</span>' : ''}</span>
          <span class="palace-stem-branch">${escapeHtml(palace.heavenlyStem || '')}${escapeHtml(palace.earthlyBranch || '')}</span>
        </div>
        ${majorStarsHtml}
        ${minorStarsHtml}
        ${adjectiveStarsHtml}
        <div class="horoscope-overlay" data-index="${palace.index}"></div>
      `;

      cell.addEventListener('mouseenter', () => showPalaceInfo(palace));
      cell.addEventListener('mouseleave', resetPalaceInfo);
      cell.addEventListener('click', () => showPalaceInfo(palace));

      chartGrid.appendChild(cell);
    });

    resetPalaceInfo();
  }

  function updateHoroscopeOverlay() {
    const activeScopes = Object.keys(horoscopeState).filter((scope) => horoscopeState[scope]);

    if (activeScopes.length === 0) {
      clearHoroscopeOverlay();
      return;
    }
    if (!currentPayload) return;

    try {
      const astrolabeRaw = computeAstrolabe(currentPayload);
      const horoscopeRaw = astrolabeRaw.horoscope();
      const horoscope = {
        solarDate: horoscopeRaw.solarDate,
        lunarDate: horoscopeRaw.lunarDate,
        decadal: simplifyHoroscopeItem(horoscopeRaw.decadal),
        yearly: simplifyHoroscopeItem(horoscopeRaw.yearly),
        monthly: simplifyHoroscopeItem(horoscopeRaw.monthly),
        daily: simplifyHoroscopeItem(horoscopeRaw.daily),
      };
      renderHoroscopeOverlay(horoscope, activeScopes);
    } catch (err) {
      errorMsg.textContent = err.message || '運限計算失敗';
      errorMsg.classList.remove('hidden');
    }
  }

  function clearHoroscopeOverlay() {
    chartGrid.querySelectorAll('.horoscope-overlay').forEach((el) => { el.innerHTML = ''; });
    const legendEl = document.getElementById('horoscope-legend');
    if (legendEl) legendEl.innerHTML = '';
  }

  function getDecadalRangeText(scope, item) {
    if (scope !== 'decadal' || !currentAstrolabe) return '';
    const palace = currentAstrolabe.palaces.find((p) => p.index === item.index);
    if (!palace || !palace.decadalRange) return '';
    return `　${palace.decadalRange[0]}-${palace.decadalRange[1]}歲`;
  }

  function renderHoroscopeOverlay(horoscope, activeScopes) {
    clearHoroscopeOverlay();

    const legendLines = [];

    activeScopes.forEach((scope) => {
      const item = horoscope[scope];
      if (!item) return;
      const cfg = SCOPE_CONFIG[scope];

      const mutagenText = (item.mutagen || [])
        .map((name, i) => `${name}${MUTAGEN_LABELS[i] || ''}`)
        .join(' ');
      const ageRangeText = getDecadalRangeText(scope, item);
      legendLines.push(
        `<div style="color:${cfg.color}">${escapeHtml(cfg.label)}四化（${escapeHtml(item.heavenlyStem || '')}${escapeHtml(item.earthlyBranch || '')}${ageRangeText}）：${escapeHtml(mutagenText)}</div>`
      );

      (item.palaceNames || []).forEach((name, idx) => {
        const overlayEl = chartGrid.querySelector(`.horoscope-overlay[data-index="${idx}"]`);
        if (!overlayEl) return;
        const starsForPalace = (item.stars && item.stars[idx]) || [];
        const starsText = starsForPalace
          .map((s) => `${s.name}${s.mutagen ? `[${s.mutagen}]` : ''}`)
          .join(' ');

        const tag = document.createElement('div');
        tag.className = 'horoscope-tag';
        tag.style.color = cfg.color;
        tag.style.borderColor = cfg.color;
        tag.innerHTML = `<span class="horoscope-scope-label">${escapeHtml(cfg.label)}</span>${escapeHtml(name)}${starsText ? `　${escapeHtml(starsText)}` : ''}`;
        overlayEl.appendChild(tag);
      });
    });

    const legendEl = document.getElementById('horoscope-legend');
    if (legendEl) legendEl.innerHTML = legendLines.join('');
  }

  function formatChartText(astrolabe, horoscope) {
    const lines = [];
    lines.push('【本命】');

    (astrolabe.palaces || []).forEach((palace) => {
      const major = (palace.majorStars || [])
        .map((s) => `${s.name}${s.brightness ? `(${s.brightness})` : ''}${s.mutagen ? `[化${s.mutagen}]` : ''}`)
        .join('、');
      const minor = (palace.minorStars || []).join('、');
      const adjective = (palace.adjectiveStars || []).join('、');

      lines.push(`${palace.name}${palace.isBodyPalace ? '（身宮）' : ''}　${palace.heavenlyStem || ''}${palace.earthlyBranch || ''}`);
      if (major) lines.push(`  主星：${major}`);
      if (minor) lines.push(`  副星：${minor}`);
      if (adjective) lines.push(`  雜曜：${adjective}`);
    });

    lines.push('');
    lines.push('【運限】');

    ['decadal', 'yearly', 'monthly', 'daily'].forEach((scope) => {
      const item = horoscope[scope];
      if (!item) return;
      const cfg = SCOPE_CONFIG[scope];
      const mutagenText = (item.mutagen || [])
        .map((name, i) => `${name}${MUTAGEN_LABELS[i] || ''}`)
        .join('、');
      let ageRangeText = '';
      if (scope === 'decadal') {
        const decadalPalace = (astrolabe.palaces || []).find((p) => p.index === item.index);
        if (decadalPalace && decadalPalace.decadalRange) {
          ageRangeText = `　${decadalPalace.decadalRange[0]}-${decadalPalace.decadalRange[1]}歲`;
        }
      }

      lines.push(`${cfg.label}（${item.heavenlyStem || ''}${item.earthlyBranch || ''}${ageRangeText}）四化：${mutagenText}`);

      (item.palaceNames || []).forEach((name, idx) => {
        const palace = (astrolabe.palaces || []).find((p) => p.index === idx);
        const stemBranch = palace ? `${palace.heavenlyStem || ''}${palace.earthlyBranch || ''}` : '';
        const starsForPalace = (item.stars && item.stars[idx]) || [];
        const starsText = starsForPalace
          .map((s) => `${s.name}${s.mutagen ? `[${s.mutagen}]` : ''}`)
          .join('、');

        lines.push(`  ${stemBranch}　${cfg.label}${name}${starsText ? `　流耀：${starsText}` : ''}`);
      });
      lines.push('');
    });

    return lines.join('\n').trim();
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  // ---- 一鍵複製按鈕（現在是靜態按鈕，命盤算完才顯示） ----

  copyChartBtn.addEventListener('click', async () => {
    if (!currentAstrolabe || !currentPayload) return;
    try {
      const astrolabeRaw = computeAstrolabe(currentPayload);
      const horoscopeRaw = astrolabeRaw.horoscope();
      const horoscope = {
        decadal: simplifyHoroscopeItem(horoscopeRaw.decadal),
        yearly: simplifyHoroscopeItem(horoscopeRaw.yearly),
        monthly: simplifyHoroscopeItem(horoscopeRaw.monthly),
        daily: simplifyHoroscopeItem(horoscopeRaw.daily),
      };
      await copyTextToClipboard(formatChartText(currentAstrolabe, horoscope));
      copyChartBtn.textContent = '已複製 ✓';
      copyChartBtn.classList.add('copied');
    } catch (err) {
      copyChartBtn.textContent = '複製失敗';
    }
    setTimeout(() => {
      copyChartBtn.textContent = '📋 一鍵複製（命盤＋大限流年流月流日）';
      copyChartBtn.classList.remove('copied');
    }, 1500);
  });

  // ---- 八字（lunar-typescript，簡體轉繁體） ----

  const S2T_MAP = {
    '财': '財', '伤': '傷', '杀': '殺', '涧': '澗', '炉': '爐', '头': '頭', '灯': '燈',
    '杨': '楊', '剑': '劍', '锋': '鋒', '长': '長', '雳': '靂', '驿': '驛', '钗': '釵',
    '钏': '釧', '蜡': '蠟', '临': '臨', '带': '帶', '绝': '絕', '养': '養', '树': '樹',
  };
  function toTraditional(str) {
    if (!str) return str;
    return String(str).split('').map((ch) => S2T_MAP[ch] || ch).join('');
  }

  let currentBazi = null;
  let currentYun = null;

  function computeBazi() {
    const birthDate = resolveGregorianBirthDate();
    const genderCode = document.getElementById('gender').value === '男' ? 1 : 0;
    const solar = LunarTS.Solar.fromYmdHms(
      birthDate.year, birthDate.month, birthDate.day,
      lastSolarTimeResult.trueSolarHour, lastSolarTimeResult.trueSolarMinute, 0
    );
    currentBazi = solar.getLunar().getEightChar();
    currentYun = currentBazi.getYun(genderCode);
  }

  // 十神是「日主天干」與「目標天干」的固定對應表，直接沿用 lunar-typescript
  // 內部已經算好、已驗證過的 LunarUtil.SHI_SHEN／ZHI_HIDE_GAN 對照表，
  // 不是自行簡化推算——只是把同一套查表邏輯套用到大運／流年的干支上
  // （EightChar 本身沒有提供大運、流年的十神方法）。
  function shishenForGan(dayGan, targetGan) {
    if (!targetGan) return '';
    const raw = LunarTS.LunarUtil.SHI_SHEN[dayGan + targetGan];
    return raw ? toTraditional(raw) : '';
  }
  // 地支藏干可能有 1~3 個，每個藏干各自對應一個十神，所以要全部列出，
  // 不能只取本氣（第一個）。
  function shishenForZhi(dayGan, zhi) {
    if (!zhi) return '';
    const hideGan = LunarTS.LunarUtil.ZHI_HIDE_GAN[zhi] || [];
    return hideGan.map((g) => shishenForGan(dayGan, g)).filter(Boolean).join('、');
  }

  function getBaziGridColumns() {
    const bz = currentBazi;
    const dayGan = bz.getDayGan();
    const thisYear = new Date().getFullYear();
    const dayunList = currentYun.getDaYun(10);
    const currentDaYun = dayunList.find((d) => thisYear >= d.getStartYear() && thisYear <= d.getEndYear());

    let dayunGan = '', dayunZhi = '', liuNianGan = '', liuNianZhi = '';
    if (currentDaYun) {
      const dgz = currentDaYun.getGanZhi();
      if (dgz) { dayunGan = dgz[0]; dayunZhi = dgz[1]; }
      const liuNian = currentDaYun.getLiuNian().find((l) => l.getYear() === thisYear);
      if (liuNian) {
        const lgz = liuNian.getGanZhi();
        liuNianGan = lgz[0]; liuNianZhi = lgz[1];
      }
    }

    return [
      {
        label: '時柱', gan: bz.getTimeGan(), zhi: bz.getTimeZhi(),
        ganShiShen: toTraditional(bz.getTimeShiShenGan()),
        zhiShiShen: (bz.getTimeShiShenZhi() || []).map(toTraditional).join('、'),
      },
      {
        label: '日柱（日主）', gan: bz.getDayGan(), zhi: bz.getDayZhi(),
        ganShiShen: '日主',
        zhiShiShen: (bz.getDayShiShenZhi() || []).map(toTraditional).join('、'),
      },
      {
        label: '月柱', gan: bz.getMonthGan(), zhi: bz.getMonthZhi(),
        ganShiShen: toTraditional(bz.getMonthShiShenGan()),
        zhiShiShen: (bz.getMonthShiShenZhi() || []).map(toTraditional).join('、'),
      },
      {
        label: '年柱', gan: bz.getYearGan(), zhi: bz.getYearZhi(),
        ganShiShen: toTraditional(bz.getYearShiShenGan()),
        zhiShiShen: (bz.getYearShiShenZhi() || []).map(toTraditional).join('、'),
      },
      {
        label: '大運', gan: dayunGan, zhi: dayunZhi,
        ganShiShen: shishenForGan(dayGan, dayunGan), zhiShiShen: shishenForZhi(dayGan, dayunZhi),
      },
      {
        label: '流年', gan: liuNianGan, zhi: liuNianZhi,
        ganShiShen: shishenForGan(dayGan, liuNianGan), zhiShiShen: shishenForZhi(dayGan, liuNianZhi),
      },
    ];
  }

  function renderBaziGrid() {
    const columns = getBaziGridColumns();
    const titleRow = columns.map((c) => `<div class="bazi-cell bazi-cell-title">${escapeHtml(c.label)}</div>`).join('');
    const ganRow = columns.map((c) => `
      <div class="bazi-cell">
        <div class="bazi-char">${escapeHtml(c.gan || '—')}</div>
        <div class="bazi-shishen">${escapeHtml(c.ganShiShen || '')}</div>
      </div>
    `).join('');
    const zhiRow = columns.map((c) => `
      <div class="bazi-cell">
        <div class="bazi-char">${escapeHtml(c.zhi || '—')}</div>
        <div class="bazi-shishen">${escapeHtml(c.zhiShiShen || '')}</div>
      </div>
    `).join('');
    return `<div class="bazi-grid">${titleRow}${ganRow}${zhiRow}</div>`;
  }

  function updateBaziContent() {
    baziContent.innerHTML = currentBazi ? renderBaziGrid() : '';
  }

  function formatBaziText() {
    const lines = ['【八字】'];
    getBaziGridColumns().forEach((c) => {
      lines.push(`${c.label}　天干：${c.gan || '—'}（${c.ganShiShen || '—'}）　地支：${c.zhi || '—'}（${c.zhiShiShen || '—'}）`);
    });
    return lines.join('\n').trim();
  }

  copyBaziBtn.addEventListener('click', async () => {
    if (!currentBazi || !currentYun) return;
    try {
      await copyTextToClipboard(formatBaziText());
      copyBaziBtn.textContent = '已複製 ✓';
      copyBaziBtn.classList.add('copied');
    } catch (err) {
      copyBaziBtn.textContent = '複製失敗';
    }
    setTimeout(() => {
      copyBaziBtn.textContent = '📋 一鍵複製八字';
      copyBaziBtn.classList.remove('copied');
    }, 1500);
  });

  function resetBaziSection() {
    baziSection.classList.add('hidden');
    currentBazi = null;
    currentYun = null;
    baziContent.innerHTML = '';
  }

  // ---- 本機使用者列表（存在瀏覽器 localStorage，不會上傳到伺服器） ----

  const STORAGE_KEY = 'ziweiSavedUsers';

  function loadSavedUsers() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      return Array.isArray(parsed) ? parsed : [];
    } catch (err) {
      return [];
    }
  }

  function saveSavedUsers(users) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(users));
  }

  function generateId() {
    if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
    return 'u_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  }

  function showScreen(name) {
    startScreen.classList.toggle('hidden', name !== 'start');
    mainScreen.classList.toggle('hidden', name !== 'main');
  }

  function formatBirthInfoMeta(b) {
    const dateLabel = b.dateType === 'lunar' ? '農曆' : '國曆';
    const timeLabel = `${String(b.birthHour).padStart(2, '0')}:${String(b.birthMinute).padStart(2, '0')}`;
    return `${dateLabel} ${b.year}/${b.month}/${b.day} ${timeLabel} · ${b.gender}`;
  }

  function renderStartScreen() {
    const users = loadSavedUsers();
    userListEl.innerHTML = users
      .map((u) => `
        <div class="user-list-row">
          <button type="button" class="user-list-item" data-id="${escapeHtml(u.id)}">
            <span class="user-list-name">${escapeHtml(u.name)}</span>
            <span class="user-list-meta">${escapeHtml(formatBirthInfoMeta(u.birthInfo))}</span>
          </button>
          <a class="user-ai-btn" href="ai-interpret.html?userId=${encodeURIComponent(u.id)}">✨ AI解盤</a>
          <button type="button" class="user-delete-btn" data-id="${escapeHtml(u.id)}">刪除</button>
        </div>
      `)
      .join('');
    emptyUserHint.classList.toggle('hidden', users.length > 0);

    userListEl.querySelectorAll('.user-list-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        const user = users.find((u) => u.id === btn.dataset.id);
        if (!user) return;
        openUserChart(user);
      });
    });

    userListEl.querySelectorAll('.user-delete-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const user = users.find((u) => u.id === btn.dataset.id);
        if (!user) return;
        showConfirmModal(`確定要刪除「${user.name}」的資料嗎？此動作無法復原。`, () => {
          const remaining = loadSavedUsers().filter((u) => u.id !== user.id);
          saveSavedUsers(remaining);
          renderStartScreen();
        });
      });
    });
  }

  function openUserChart(user) {
    showScreen('main');
    loadProfileIntoForm(user);
    runChart();
  }

  function loadProfileIntoForm(user) {
    const b = user.birthInfo;
    nameInput.value = user.name;
    dateTypeSelect.value = b.dateType;
    leapField.classList.toggle('hidden', b.dateType !== 'lunar');
    yearSelect.value = b.year;
    monthSelect.value = b.month;
    updateDayOptions();
    daySelect.value = b.day;
    document.getElementById('isLeapMonth').checked = !!b.isLeapMonth;
    birthHourSelect.value = b.birthHour;
    birthMinuteSelect.value = b.birthMinute;
    document.getElementById('gender').value = b.gender;

    if (b.location) {
      continentSelect.value = b.location.continent;
      populateCountries(b.location.country);
      citySearchInput.value = '';
      populateCities(b.location.city);
    }
    recomputeSolarTime();
  }

  function getCurrentBirthInfo() {
    return {
      dateType: dateTypeSelect.value,
      year: Number(yearSelect.value),
      month: Number(monthSelect.value),
      day: Number(daySelect.value),
      isLeapMonth: document.getElementById('isLeapMonth').checked,
      birthHour: Number(birthHourSelect.value),
      birthMinute: Number(birthMinuteSelect.value),
      gender: document.getElementById('gender').value,
      location: getSelectedLocation(),
    };
  }

  function openModal(el) { el.classList.remove('hidden'); }
  function closeModal(el) { el.classList.add('hidden'); }

  let pendingConfirmAction = null;

  function showConfirmModal(message, onConfirm) {
    overwriteModalText.textContent = message;
    pendingConfirmAction = onConfirm;
    openModal(overwriteModal);
  }

  overwriteConfirmBtn.addEventListener('click', () => {
    closeModal(overwriteModal);
    if (pendingConfirmAction) pendingConfirmAction();
    pendingConfirmAction = null;
  });
  overwriteCancelBtn.addEventListener('click', () => {
    closeModal(overwriteModal);
    pendingConfirmAction = null;
  });
  successOkBtn.addEventListener('click', () => closeModal(successModal));

  saveChartBtn.addEventListener('click', () => {
    saveStatus.textContent = '';
    const name = nameInput.value.trim();
    if (!name) {
      saveStatus.textContent = '請先輸入姓名再儲存';
      return;
    }
    const birthInfo = getCurrentBirthInfo();
    if (!birthInfo.location) {
      saveStatus.textContent = '請先選擇出生地';
      return;
    }

    const users = loadSavedUsers();
    const existing = users.find((u) => u.name === name);

    const doSave = () => {
      const list = loadSavedUsers();
      const idx = list.findIndex((u) => u.name === name);
      if (idx >= 0) {
        list[idx].birthInfo = birthInfo;
      } else {
        list.push({ id: generateId(), name, birthInfo });
      }
      saveSavedUsers(list);
      openModal(successModal);
    };

    if (existing) {
      showConfirmModal(`已經有「${name}」的資料，要覆蓋嗎？`, doSave);
    } else {
      doSave();
    }
  });

  function resetFormToDefaults() {
    nameInput.value = '';
    dateTypeSelect.value = 'solar';
    leapField.classList.add('hidden');
    document.getElementById('isLeapMonth').checked = false;
    yearSelect.value = CURRENT_YEAR - 30;
    monthSelect.value = 1;
    updateDayOptions();
    daySelect.value = 1;
    birthHourSelect.value = 12;
    birthMinuteSelect.value = 0;
    document.getElementById('gender').value = '女';
    continentSelect.value = 'Asia';
    populateCountries('Taiwan');
    citySearchInput.value = '';
    populateCities('Taipei');
    recomputeSolarTime();

    errorMsg.classList.add('hidden');
    saveStatus.textContent = '';
    chartGrid.classList.add('hidden');
    palaceInfoPanel.classList.add('hidden');
    chartActions.classList.add('hidden');
    currentPayload = null;
    currentAstrolabe = null;
    resetBaziSection();
  }

  newUserBtn.addEventListener('click', () => {
    resetFormToDefaults();
    showScreen('main');
  });

  backToListBtn.addEventListener('click', () => {
    renderStartScreen();
    showScreen('start');
  });

  // ---- 開場畫面：有存過使用者就顯示列表，否則直接進入表單 ----
  renderStartScreen();
  showScreen(loadSavedUsers().length > 0 ? 'start' : 'main');
</script>
</body>
